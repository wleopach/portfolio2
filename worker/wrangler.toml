name = "portfolio-chat"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# lib/data.ts reads process.env.NODE_ENV to compute basePath.
[define]
"process.env.NODE_ENV" = '"production"'

[vars]
ALLOWED_ORIGINS = "https://wleopach.github.io,http://localhost:3000"

# 20 requests per minute per IP.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Secrets (set with `npx wrangler secret put <NAME>`):
#   OPENAI_API_KEY, APPS_SCRIPT_URL, LOG_SECRET
